name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref, but never cancels main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current stable. Testing both matters because the engine
        # leans on stdlib dataclasses with slots and on match statements in the parser,
        # either of which could quietly change behaviour across versions.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy

      - name: Unit tests
        run: pytest --cov=src/trueplumb --cov-report=term-missing --cov-report=xml

      # The corpus is a regression suite for the engine expressed as data rather than
      # code, so it is verified in CI on the same footing. A case whose expected verdict
      # drifts from what the engine produces is a failing claim about safety, and must not
      # be able to sit in the repository looking authoritative.
      - name: Verify attack corpus
        run: python scripts/verify_corpus.py corpus/

      # The measurement layer must stay reproducible. `score` is asserted to produce
      # byte-identical output on two runs, because a rate that drifts between machines
      # cannot be compared against another control's rate -- which is the only reason the
      # number is computed here in the first place. Run on one version only; the
      # arithmetic is closed-form and version-independent.
      - name: Measurement layer is reproducible
        if: matrix.python-version == '3.12'
        run: |
          python -m trueplumb.cli score corpus/ --adapter allowlist > /tmp/score_a.txt
          python -m trueplumb.cli score corpus/ --adapter allowlist > /tmp/score_b.txt
          diff /tmp/score_a.txt /tmp/score_b.txt
          cat /tmp/score_a.txt

          # block-everything must still show 100% on BOTH rates. If a future change ever
          # collapses these into a single number, this fails -- which is the point.
          python -m trueplumb.cli score corpus/ --adapter block-everything \
            | tee /tmp/block.txt
          test "$(grep -c '100.0%' /tmp/block.txt)" -ge 2

      # The committed Presidio decision logs are the only vendor evidence in the
      # repository, so a stale one would keep reporting numbers for a corpus that no
      # longer exists. Re-running the product here is not an option -- it needs a presidio
      # sandbox -- so instead each log is checked for internal consistency against the
      # corpus: every case and every step the corpus defines must be present. Adding a case
      # without re-recording fails, which is the intended direction.
      #
      # The scores themselves are NOT recomputed in CI. They are a property of the pinned
      # product version and regenerating them needs the sandbox.
      - name: Vendor decision logs cover the whole corpus
        if: matrix.python-version == '3.12'
        run: python scripts/check_vendor_logs.py measurements/

      # The one result in this repository about a real product rather than about our own
      # baselines. Asserted so that collapsing the two rates into one, or quietly
      # re-tuning the rendering, fails the build instead of producing a flattering number.
      - name: Presidio result still shows the false-positive half
        if: matrix.python-version == '3.12'
        run: |
          python -m trueplumb.cli score corpus/ --adapter presidio-payload | tee /tmp/presidio.txt
          grep -q 'detection' /tmp/presidio.txt
          grep -q 'false positives' /tmp/presidio.txt
          python scripts/assert_presidio_finding.py

      # The gate that makes the rest of the suite trustworthy. The reference implementation
      # in scripts/differential_test.py shares no code path with the derivative-based
      # monitor, so it is an independent opinion rather than a restatement of the engine's
      # own assumptions. Several genuine bugs in end-of-trace semantics -- including two
      # that every hand-derived test initially agreed with -- were found only here.
      - name: Differential vs reference semantics (exhaustive, length 4)
        run: python scripts/differential_test.py 4

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  # The exhaustive check grows as (alphabet+1)^length, so length 6 is far too slow to run
  # on every push. It runs on a schedule and before releases, where a deeper sweep is worth
  # the minutes. The counts are measured, not extrapolated: 6,540 traces at length 4,
  # 23,946 at length 5, 91,182 at length 6. An earlier revision of this comment claimed
  # ~330k for length 6, which is 3.6x the real figure.
  deep:
    name: deep differential sweep
    runs-on: ubuntu-latest
    # Manual trigger, plus nightly and pre-release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Differential sweep, length 6 (91,182 traces)
        run: python scripts/differential_test.py 6
