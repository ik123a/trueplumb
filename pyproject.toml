[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trueplumb"
version = "0.1.0.dev0"
description = "Vendor-neutral conformance testbed for AI agent safety controls. Judge-free verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "trueplumb contributors" }]
keywords = ["ai-safety", "llm", "agents", "runtime-verification", "temporal-logic", "conformance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.100",
]
stats = ["scipy>=1.14"]
devfull = ["trueplumb[dev,stats]"]

[project.scripts]
trueplumb = "trueplumb.cli:main"

[project.urls]
Homepage = "https://github.com/ik123a/trueplumb"
Repository = "https://github.com/ik123a/trueplumb"
Issues = "https://github.com/ik123a/trueplumb/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trueplumb"]

# PEP 561: ship the py.typed marker so downstream mypy actually reads our annotations.
# Without it a `pip install trueplumb` consumer gets "module is installed, but missing
# library stubs or py.typed marker" and mypy silently treats the package as untyped --
# which for a library whose whole point is trustworthy types would be self-defeating.
[tool.hatch.build.targets.sdist]
include = ["src/trueplumb", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The exhaustive differential harness lives under scripts/, not tests/: it is a comparison
# tool, not a unit test. It stays out of the default run because it enumerates every trace
# over an alphabet and prints a report, but CI invokes it explicitly as its own gate.
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests",
  "corpus: tests that depend on the attack corpus",
  # Exhaustive engine-vs-reference comparison. This is the gate that catches semantic
  # regressions no hand-derived test can: the reference shares no code path with the
  # monitor, so it can contradict the author's assumptions instead of confirming them.
  "differential: exhaustive engine-vs-reference comparison",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["trueplumb"]

[tool.coverage.run]
source = ["src/trueplumb"]
